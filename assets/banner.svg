      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- BURNRATE wordmark gradient: teal -> Antigravity cyan -> Claude violet -> Codex amber -> Flame -->
    <linearGradient id="burnGrad" gradientUnits="userSpaceOnUse" x1="255" y1="0" x2="640" y2="0">
