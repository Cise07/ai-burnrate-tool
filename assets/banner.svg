<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 112" width="680" height="112" role="img" aria-label="AI BURNRATE">
  <defs>
    <!-- Flame icon gradient across all 4 rows: bright amber tip -> warm coral -> ember -->
    <linearGradient id="flameGrad" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="94">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="52%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
