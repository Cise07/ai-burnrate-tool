name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Update npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Sync package version with release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid release tag version: $VERSION" >&2
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Type-check project
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Commit version bump to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          PRE_BUMP_SHA="$(git rev-parse HEAD)"
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to $VERSION"
            git push origin main
            if [ "$PRE_BUMP_SHA" = "$GITHUB_SHA" ]; then
              git tag -f "$GITHUB_REF_NAME" HEAD
              git push --force origin "refs/tags/$GITHUB_REF_NAME"
            fi
          fi
